<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge Line</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232d; --line:#262d38;
    --ink:#e8edf4; --ink-dim:#9aa7b8; --ink-faint:#68758a;
    --accent:#f0b429; --good:#3ecf8e; --bad:#f2555a; --live:#5b9dff;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header{
    display:flex; align-items:center; gap:16px; padding:14px 22px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{font-size:17px; font-weight:650; letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  .back{
    color:var(--ink-dim); text-decoration:none; font-size:13px;
    padding:5px 11px; border:1px solid var(--line); border-radius:8px;
  }
  .back:hover{color:var(--ink); border-color:var(--ink-faint)}
  .spacer{flex:1}
  .mode{
    font-size:12px; padding:5px 11px; border-radius:999px;
    border:1px solid var(--line); color:var(--ink-dim);
  }
  .mode.live{color:var(--good); border-color:#1e4936}
  .mode.fake{color:var(--accent); border-color:#4a3a12}

  main{display:grid; grid-template-columns:minmax(320px,390px) 1fr; gap:18px; padding:18px; align-items:start}
  @media (max-width:900px){ main{grid-template-columns:1fr} }

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .panel h2{
    margin:0; padding:13px 17px; font-size:12px; font-weight:600;
    text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    border-bottom:1px solid var(--line);
  }
  .panel .body{padding:15px 17px}
  .stack{display:flex; flex-direction:column; gap:18px}

  input,select,textarea,button{font:inherit; color:inherit}
  input,select{
    width:100%; padding:9px 11px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:9px;
  }
  input:focus,select:focus{outline:none; border-color:var(--live)}
  label{display:block; font-size:12px; color:var(--ink-faint); margin:0 0 5px}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .field{margin-bottom:11px}

  button{
    padding:9px 15px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:9px; cursor:pointer; font-weight:550;
  }
  button:hover:not(:disabled){border-color:var(--ink-faint)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#231a04}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button.call{background:var(--good); border-color:var(--good); color:#04231a; font-size:15px; padding:11px 20px}

  /* queue */
  .queue{list-style:none; margin:0; padding:0; max-height:44vh; overflow-y:auto}
  .queue li{
    padding:12px 17px; border-bottom:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; gap:11px;
  }
  .queue li:hover{background:var(--panel-2)}
  .queue li.sel{background:var(--panel-2); box-shadow:inset 3px 0 0 var(--accent)}
  .q-main{flex:1; min-width:0}
  .q-name{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .q-sub{font-size:12px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  .pill{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-dim); white-space:nowrap}
  .pill.dialing,.pill.in_progress{color:var(--live); border-color:#1d3a63; background:#12203a}
  .pill.dialing::before,.pill.in_progress::before{
    content:""; display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--live); margin-right:6px; vertical-align:middle;
    animation:pulse 1.1s ease-in-out infinite;
  }
  .pill.completed{color:var(--good); border-color:#1e4936}
  .pill.failed{color:var(--bad); border-color:#5a2024}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.8)}}

  /* result hero */
  .hero{padding:22px 24px; border-bottom:1px solid var(--line)}
  .hero-top{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
  .badge{
    font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 14px; border-radius:9px; white-space:nowrap;
  }
  .badge.yes{background:#12331f; color:var(--good); border:1px solid #1e4936}
  .badge.no{background:#33151a; color:var(--bad); border:1px solid #5a2024}
  .badge.pending{background:var(--panel-2); color:var(--ink-faint); border:1px solid var(--line)}
  .venue-name{font-size:23px; font-weight:680; letter-spacing:-.02em; margin:0 0 3px}
  .venue-sub{color:var(--ink-faint); font-size:13px}
  .when{margin-left:auto; text-align:right}
  .when .n{font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1; white-space:nowrap}
  .when .u{font-size:12px; color:var(--ink-faint); margin-top:3px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:15px}
  .chip{font-size:12px; padding:5px 11px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim)}
  .chip.alt{background:#2c2408; color:var(--accent); border-color:#4a3a12}
  .chip.conf-low{color:var(--bad); border-color:#5a2024}

  dl.facts{margin:0; padding:6px 24px 20px}
  dl.facts div{display:grid; grid-template-columns:160px 1fr; gap:14px; padding:10px 0; border-bottom:1px solid var(--line)}
  dl.facts div:last-child{border-bottom:none}
  dl.facts dt{color:var(--ink-faint); font-size:13px}
  dl.facts dd{margin:0; font-size:14px}

  .empty{padding:44px 24px; text-align:center; color:var(--ink-faint)}
  .err{padding:12px 24px; color:var(--bad); font-size:13px}

  /* transcript */
  .transcript{max-height:32vh; overflow-y:auto; padding:6px 17px 15px}
  .turn{display:flex; gap:9px; padding:7px 0; font-size:13.5px; line-height:1.45}
  .who{
    flex:0 0 58px; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); padding-top:2px;
  }
  .turn.agent .who{color:var(--accent)}
  .turn .what{flex:1; color:var(--ink)}
  .turn.caller .what{color:var(--ink-dim)}

  .note{
    padding:15px 17px; background:var(--panel-2); border-radius:11px;
    font-size:14.5px; line-height:1.62; white-space:pre-wrap;
  }
  .note-src{font-size:11px; color:var(--ink-faint); margin-top:9px}
  .actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:13px}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:9px}
</style>
</head>
<body>

<header>
  <div class="brand">Concierge<span>·</span>Line</div>
  <a class="back" id="backlink" href="#" hidden>&larr; Roadio</a>
  <div class="spacer"></div>
  <div class="mode" id="mode">connecting…</div>
</header>

<main>
  <!-- LEFT -->
  <div class="stack">
    <section class="panel">
      <h2>Book something</h2>
      <div class="body">
        <div class="field">
          <label for="f-name">Restaurant, bar or tour</label>
          <input id="f-name" placeholder="The Local">
        </div>
        <div class="row3">
          <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="2026-08-13"></div>
          <div class="field"><label for="f-time">Time</label><input id="f-time" type="time" value="19:00"></div>
          <div class="field"><label for="f-party">People</label><input id="f-party" type="number" min="1" max="20" value="2"></div>
        </div>
        <div class="field">
          <label for="f-notes">Anything they should know</label>
          <input id="f-notes" placeholder="anniversary, would love a table outside">
        </div>
        <button class="primary" id="f-go" style="width:100%">Add to queue</button>
      </div>
    </section>

    <section class="panel">
      <h2>Call queue</h2>
      <ul class="queue" id="queue"></ul>
    </section>
  </div>

  <!-- RIGHT -->
  <div class="stack">
    <section class="panel">
      <h2>Reservation</h2>
      <div id="result"><div class="empty">Select something from the queue.</div></div>
    </section>

    <section class="panel" id="transcript-panel" hidden>
      <h2>Live transcript · ElevenLabs Scribe</h2>
      <div class="transcript" id="transcript"></div>
    </section>

    <section class="panel" id="note-panel" hidden>
      <h2>Your confirmation</h2>
      <div class="body">
        <div class="note" id="note"></div>
        <div class="note-src" id="note-src"></div>
        <div class="actions">
          <button id="n-copy">Copy</button>
        </div>
      </div>
    </section>
  </div>
</main>

<elevenlabs-convai agent-id="__AGENT_ID__"></elevenlabs-convai>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

<script>
const MAIN_APP_URL = "__MAIN_APP_URL__";
const $ = (id) => document.getElementById(id);

let tasks = [];
let selectedId = null;
let lastSignature = "";

if (MAIN_APP_URL) {
  const link = $("backlink");
  link.href = MAIN_APP_URL;
  link.hidden = false;
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const fmtDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
};

const fmtTime = (hhmm) => {
  if (!hhmm) return "";
  const m = /^(\d{1,2}):(\d{2})/.exec(hhmm);
  if (!m) return hhmm;
  const h = Number(m[1]);
  return `${h % 12 || 12}:${m[2]} ${h < 12 ? "AM" : "PM"}`;
};

// ---- health -------------------------------------------------------------
async function loadHealth() {
  try {
    const h = await (await fetch("/api/health")).json();
    const el = $("mode");
    if (h.fake_call_mode) {
      el.textContent = "Demo mode · no telephony";
      el.className = "mode fake";
    } else {
      el.textContent = "Live telephony";
      el.className = "mode live";
    }
  } catch {
    $("mode").textContent = "backend unreachable";
  }
}

// ---- polling ------------------------------------------------------------
async function poll() {
  try {
    const data = await (await fetch("/api/tasks")).json();
    tasks = data.tasks || [];
    if (selectedId === null && tasks.length) selectedId = tasks[0].id;
    const signature = JSON.stringify(tasks) + selectedId;
    if (signature !== lastSignature) {
      lastSignature = signature;
      renderQueue();
      renderDetail();
    }
  } catch { /* keep polling; a blip must not kill the loop */ }
}

// ---- queue --------------------------------------------------------------
const STATUS_LABEL = {
  queued:"queued", dialing:"dialing", in_progress:"on call",
  completed:"done", failed:"failed",
};

function renderQueue() {
  $("queue").innerHTML = tasks.map((t) => `
    <li class="${t.id === selectedId ? "sel" : ""}" data-id="${esc(t.id)}">
      <div class="q-main">
        <div class="q-name">${esc(t.venue?.name)}</div>
        <div class="q-sub">${fmtDate(t.request?.date)} &middot; ${fmtTime(t.request?.time)} &middot; ${esc(t.request?.party_size)} people</div>
      </div>
      <span class="pill ${esc(t.status)}">${STATUS_LABEL[t.status] || esc(t.status)}</span>
    </li>`).join("");

  $("queue").querySelectorAll("li").forEach((li) => {
    li.onclick = () => { selectedId = li.dataset.id; renderQueue(); renderDetail(); };
  });
}

// ---- detail -------------------------------------------------------------
function renderDetail() {
  const task = tasks.find((t) => t.id === selectedId);
  if (!task) {
    $("result").innerHTML = `<div class="empty">Select something from the queue.</div>`;
    $("transcript-panel").hidden = true;
    $("note-panel").hidden = true;
    return;
  }

  const busy = task.status === "dialing" || task.status === "in_progress";
  const r = task.result;

  let hero;
  if (!r) {
    const label = task.status === "dialing" ? "dialing…"
                : task.status === "in_progress" ? "on the call…"
                : task.status === "failed" ? "call failed"
                : "not called yet";
    hero = `
      <div class="hero">
        <div class="hero-top">
          <span class="badge ${task.status === "failed" ? "no" : "pending"}">${label}</span>
          <div style="flex:1; min-width:180px">
            <h3 class="venue-name">${esc(task.venue?.name)}</h3>
            <div class="venue-sub">${esc(task.venue?.address) || "&mdash;"}</div>
          </div>
        </div>
        <div class="chips">
          <span class="chip">${fmtDate(task.request?.date)}</span>
          <span class="chip">${fmtTime(task.request?.time)}</span>
          <span class="chip">${esc(task.request?.party_size)} people</span>
        </div>
        <div class="actions">
          <button class="call" id="d-call" ${busy ? "disabled" : ""}>
            ${busy ? "Calling…" : "Call and book it"}
          </button>
        </div>
      </div>
      ${task.error ? `<div class="err">${esc(task.error)}</div>` : ""}`;
  } else {
    const confirmed = r.reservation_confirmed === true;
    const bigTime = confirmed && r.confirmed_time
      ? `<div class="when"><div class="n">${esc(r.confirmed_time)}</div>
         <div class="u">${fmtDate(task.request?.date)}</div></div>` : "";
    hero = `
      <div class="hero">
        <div class="hero-top">
          <span class="badge ${confirmed ? "yes" : "no"}">${confirmed ? "Booked" : "Not available"}</span>
          <div style="flex:1; min-width:170px">
            <h3 class="venue-name">${esc(task.venue?.name)}</h3>
            <div class="venue-sub">Table for ${esc(r.party_size || task.request?.party_size)}${r.name_on_reservation ? " &middot; under " + esc(r.name_on_reservation) : ""}</div>
          </div>
          ${bigTime}
        </div>
        <div class="chips">
          ${(r.alternatives_offered || []).map((a) => `<span class="chip alt">also offered ${esc(a)}</span>`).join("")}
          <span class="chip ${r.confidence === "low" ? "conf-low" : ""}">confidence: ${esc(r.confidence)}</span>
        </div>
        <div class="actions">
          <button id="d-call" ${busy ? "disabled" : ""}>${busy ? "Calling…" : "Call again"}</button>
        </div>
      </div>`;
  }

  let facts = "";
  if (r) {
    const rows = [
      ["Special request", r.special_requests_status],
      ["Good to know", r.notes],
    ].filter(([, v]) => v);
    facts = `<dl class="facts">${rows.map(([k, v]) =>
      `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
  }

  $("result").innerHTML = hero + facts;
  const callBtn = $("d-call");
  if (callBtn) callBtn.onclick = () => startCall(task.id);

  // transcript
  const turns = task.transcript || [];
  $("transcript-panel").hidden = turns.length === 0;
  if (!turns.length) {
    $("transcript").innerHTML = "";  // hiding alone leaves last run's turns in the DOM
  } else {
    const pane = $("transcript");
    const wasAtBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 60;
    pane.innerHTML = turns.map((t) => `
      <div class="turn ${esc(t.role)}">
        <div class="who">${t.role === "agent" ? "Iris" : "Venue"}</div>
        <div class="what">${esc(t.text)}</div>
      </div>`).join("");
    if (wasAtBottom) pane.scrollTop = pane.scrollHeight;
  }

  // note
  const hasNote = Boolean(task.summary_markdown);
  $("note-panel").hidden = !r;
  if (r) {
    $("note").textContent = hasNote ? task.summary_markdown : "Writing it up…";
    $("note-src").textContent = task.summary_source === "claude"
      ? "Written by Claude from the confirmed booking."
      : (hasNote ? "Template note (no model call needed)." : "");
    if (!hasNote) requestSummary(task.id);
  }
}

$("n-copy").onclick = async () => {
  try {
    await navigator.clipboard.writeText($("note").textContent);
    $("n-copy").textContent = "Copied";
    setTimeout(() => ($("n-copy").textContent = "Copy"), 1400);
  } catch {
    $("n-copy").textContent = "Press Ctrl+C";
  }
};

const summarizing = new Set();
async function requestSummary(id) {
  if (summarizing.has(id)) return;
  summarizing.add(id);
  try { await fetch(`/api/tasks/${id}/summarize`, { method: "POST" }); }
  catch { /* template note will land on the next poll */ }
  finally { setTimeout(() => summarizing.delete(id), 4000); }
}

// Fire and forget. The response returns immediately; everything the user sees
// after this comes from the 1.5s poll, so the presenter can keep talking.
async function startCall(id) {
  const btn = $("d-call");
  if (btn) { btn.disabled = true; btn.textContent = "Calling…"; }
  // Clear last run's transcript and note optimistically. The backend already
  // wiped them, but the UI wouldn't catch up until the next 1.5s poll - two
  // seconds of stale content on screen with the room watching.
  const local = tasks.find((t) => t.id === id);
  if (local) {
    local.transcript = []; local.result = null;
    local.summary_markdown = null; local.summary_source = null; local.error = null;
    local.status = "dialing";
    lastSignature = "";
    renderQueue(); renderDetail();
  }
  try {
    const res = await fetch(`/api/tasks/${id}/call`, { method: "POST" });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert("Call failed: " + (err.detail || res.status));
    }
  } catch (e) { alert("Call failed: " + e.message); }
  poll();
}

// ---- create -------------------------------------------------------------
$("f-go").onclick = async () => {
  const name = $("f-name").value.trim();
  if (!name) { $("f-name").focus(); return; }
  const body = {
    venue: { name, kind: "restaurant", address: "", phone: "" },
    request: {
      date: $("f-date").value,
      time: $("f-time").value,
      party_size: Number($("f-party").value) || 2,
    },
    traveler: { name: "", notes: $("f-notes").value.trim() },
  };
  const created = await (await fetch("/api/tasks", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  })).json();
  selectedId = created.id;
  $("f-name").value = ""; $("f-notes").value = "";
  poll();
};

loadHealth();
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
